tools:
  - name: FFmpeg
    repo: https://github.com/FFmpeg/FFmpeg
    category: edit-render
    runtime: local-now
    license: LGPL-2.1-or-later / GPL components vary by build
    use: [encode, crop, grade, speed-ramp, transitions, overlays, stabilization, silent-reels]
  - name: OpenCV
    repo: https://github.com/opencv/opencv
    category: vision
    runtime: local-now
    license: Apache-2.0
    use: [tracking, alignment, optical-flow, masks, homography, composition-lock]
  - name: MoviePy
    repo: https://github.com/Zulko/moviepy
    category: edit-render
    runtime: local-now
    license: MIT
    use: [timeline, compositing, rapid-prototyping]
  - name: Pillow
    repo: https://github.com/python-pillow/Pillow
    category: graphics
    runtime: local-now
    license: HPND
    use: [text, masks, image-prep, procedural-graphics]

  - name: LivePortrait
    repo: https://github.com/KlingAIResearch/LivePortrait
    category: human-animation
    runtime: cpu-slow-or-gpu
    use: [portrait-animation, expression-transfer, head-motion, identity-preserving-closeups]
    notes: best for face/head/upper-body, not full-body walking
  - name: LivePortrait-ONNXRun
    repo: https://github.com/hpc203/liveportrait-onnxrun
    category: human-animation-cpu
    runtime: cpu-candidate
    use: [onnx-portrait-animation, python-inference, cplusplus-inference]
    notes: candidate for CPU execution; requires onnxruntime plus model weights
  - name: MimicMotion
    repo: https://github.com/tencent/MimicMotion
    category: human-animation-fullbody
    runtime: gpu-required
    use: [pose-driven-full-body-animation, long-human-motion, image-to-video]
    notes: primary full-body candidate for WJ1.SY once a suitable GPU runtime is available
  - name: MusePose
    repo: https://github.com/TMElyralab/MusePose
    category: human-animation-fullbody
    runtime: gpu-required
    license: MIT-code; model non-commercial research only
    use: [pose-guided-character-animation, dance, full-body-motion]
    notes: do not use model weights for commercial publishing without cleared license
  - name: Moore-AnimateAnyone
    repo: https://github.com/MooreThreads/Moore-AnimateAnyone
    category: human-animation-fullbody
    runtime: gpu-required
    use: [pose-driven-human-animation, reference-image-animation]
    notes: secondary research candidate; verify current code/model licenses before use
  - name: DWPose
    repo: https://github.com/IDEA-Research/DWPose
    category: pose-estimation
    runtime: cpu-or-gpu
    license: Apache-2.0
    use: [whole-body-pose, pose-extraction, driving-video-preprocessing, control-signals]
    notes: preferred pose extraction layer for full-body animation pipelines

  - name: ComfyUI
    repo: https://github.com/Comfy-Org/ComfyUI
    category: generative-orchestration
    runtime: gpu-external
    license: GPL-3.0
    use: [image-generation, video-workflows, control, node-pipelines]
  - name: Wan2.2
    repo: https://github.com/Wan-Video/Wan2.2
    category: ai-video
    runtime: gpu-external
    license: Apache-2.0-code
    use: [text-to-video, image-to-video]
    notes: verify individual model-weight license before commercial publication
  - name: CogVideoX
    repo: https://github.com/zai-org/CogVideo
    category: ai-video
    runtime: gpu-external
    license: Apache-2.0-code; model-specific
    use: [text-to-video, image-to-video]
  - name: LTX-Video
    repo: https://github.com/Lightricks/LTX-Video
    category: ai-video
    runtime: gpu-external
    license: check-current-repo-and-model
    use: [text-to-video, image-to-video, fast-generation]

  - name: RobustVideoMatting
    repo: https://github.com/PeterL1n/RobustVideoMatting
    category: matting
    runtime: cpu-or-gpu
    license: GPL-3.0
    use: [person-cutout, alpha-matte, foreground-extraction, compositing]
    notes: supports PyTorch/TensorFlow/ONNX/CoreML implementations
  - name: SAM 2
    repo: https://github.com/facebookresearch/sam2
    category: segmentation
    runtime: gpu-preferred
    license: Apache-2.0
    use: [object-masks, video-segmentation, subject-isolation]
  - name: MediaPipe
    repo: https://github.com/google-ai-edge/mediapipe
    category: tracking
    runtime: cpu-capable
    license: Apache-2.0
    use: [face-landmarks, pose, tracking, alignment]

  - name: Real-ESRGAN
    repo: https://github.com/xinntao/Real-ESRGAN
    category: restoration
    runtime: gpu-preferred
    license: BSD-3-Clause
    use: [upscale, denoise, restoration]
  - name: GFPGAN
    repo: https://github.com/TencentARC/GFPGAN
    category: face-restoration
    runtime: gpu-preferred
    license: verify-current-repo-license
    use: [face-restoration, identity-recovery, post-generation-cleanup]
  - name: CodeFormer
    repo: https://github.com/sczhou/CodeFormer
    category: face-restoration
    runtime: gpu-preferred
    license: verify-current-repo-license
    use: [face-restoration, fidelity-quality-control, generated-face-cleanup]
  - name: Practical-RIFE
    repo: https://github.com/hzwer/Practical-RIFE
    category: motion
    runtime: gpu-preferred
    license: MIT
    use: [frame-interpolation, slow-motion, fps-conversion]
  - name: Whisper
    repo: https://github.com/openai/whisper
    category: speech
    runtime: cpu-or-gpu
    license: MIT
    use: [transcription, subtitle-timing]

runtime_truth:
  current_environment:
    ram_gb: 5.8
    cuda: false
    torch: cpu-only
    terminal_internet: false
    onnxruntime: missing
  rule: "Never claim a generative model is locally runnable until dependencies, model weights and a real inference test pass."

production_priority:
  cpu_now: [FFmpeg, OpenCV, MoviePy, Pillow, MediaPipe]
  cpu_next_when_dependencies_available: [LivePortrait-ONNXRun, DWPose, RobustVideoMatting]
  gpu_primary: [MimicMotion, DWPose, Real-ESRGAN, CodeFormer, Practical-RIFE]
  gpu_secondary: [Wan2.2, LTX-Video, CogVideoX, SAM-2, LivePortrait]

policy:
  rule: "Registry entry means technically interesting, not automatically commercially cleared. Check code + model + asset licenses before publication."
